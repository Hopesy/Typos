{id:14,name:'三块拼接',en:'MODULAR STRIP',group:'C / 悬浮与模块',desc:'品牌、导航、工具各占一个矩形模块，沿同一边界紧密拼接。',logic:'品牌模块使用反差底色，中段居中导航，末段集中工具。',feeling:'利落、扎实，有建筑立面的模块秩序。',tradeoff:'线条存在感较强，适合克制使用其他页面边框。'},

function siteDoc(id){const cells=Array.from({length:364},(_,i)=>'<i class="cell level-'+(i%71===0?2:i%29===0?1:0)+'"></i>').join('');return '<!doctype html><html lang="'+(lang==='zh'?'zh-CN':'en')+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+SCHEMES[id-1].name+'</title><style>'+siteCss()+'</style></head><body class="'+(theme==='light'?'light':'')+'" data-scheme="'+id+'"><header class="header variant-'+id+'"><div class="desktop-header">'+desktop(id)+'</div>'+mobile()+'<div class="menu-panel">'+links()+'<div class="menu-footer"><small>ANCHOR FOR CODE & NOTES</small><a href="#" data-nav="5">'+(lang==='zh'?'进入写作后台 ↗':'Open writing desk ↗')+'</a></div></div></header><main class="page-content"><section class="hero"><h1>TYPOS BLOG</h1><p>ANCHOR FOR CODE & NOTES</p></section><div class="status-row"><div class="status"><span><i></i><b>STATUS:</b> CODING</span><b class="status-divider"></b><span>⌖ GUANG ZHOU</span><b class="status-divider"></b><span>⊙ Moonlight Sonata · I</span></div></div><section class="heatmap"><div class="section-title"><span>'+(lang==='zh'?'足迹':'Activity')+'</span><span>'+(lang==='zh'?'阅读合集':'Explore archive')+' ↗</span></div><div class="cells">'+cells+'</div><div class="heatmap-foot"><span>'+(lang==='zh'?'总活动数：42':'42 contributions')+'</span><span>'+(lang==='zh'?'过去 52 周':'Past 52 weeks')+'</span></div></section><section class="article-grid"><article class="article"><div class="tag">01 / NOTES</div><h2>'+(lang==='zh'?'给日常留一点记录的位置':'A place for everyday notes')+'</h2><p>'+(lang==='zh'?'一些想法，一些观察。让记录慢慢成为自己的内容档案。':'Ideas, observations, and small discoveries along the way.')+'</p></article><article class="article"><div class="tag">02 / CODE</div><h2>'+(lang==='zh'?'让复杂的事情变得简单':'Making complex things simple')+'</h2><p>'+(lang==='zh'?'关于代码、工具，以及在构建过程里学到的事情。':'On code, tools, and what we learn while building.')+'</p></article><article class="article"><div class="tag">03 / MOMENTS</div><h2>'+(lang==='zh'?'路过，也认真看过':'Looking a little closer')+'</h2><p>'+(lang==='zh'?'把值得留下的细节，收进时间的角落。':'A collection of small moments worth keeping.')+'</p></article></section><footer class="footer"><span>TYPOS / A PERSONAL JOURNAL</span><span>GITHUB　·　EMAIL　·　ABOUT</span></footer></main><div class="site-toast" role="status"></div><script>const header=document.querySelector(".header");let timer;document.addEventListener("click",event=>{const toggle=event.target.closest(".menu-toggle");if(toggle){const open=header.classList.toggle("open");document.querySelectorAll(".menu-toggle").forEach(el=>el.setAttribute("aria-expanded",String(open)));return;}const action=event.target.closest("[data-action]");if(action){parent.postMessage({app:"typos-nav-studies",action:action.dataset.action},"*");return;}const link=event.target.closest("a");if(link){event.preventDefault();const key=link.dataset.nav??"0";document.querySelectorAll(".nav a").forEach(el=>el.classList.toggle("active",el.dataset.nav===key));header.classList.remove("open");document.querySelectorAll(".menu-toggle").forEach(el=>el.setAttribute("aria-expanded","false"));const toast=document.querySelector(".site-toast");toast.textContent=key==="5"?"写作后台入口 · 布局预览":"已选中："+(link.textContent.trim()||"首页");toast.classList.add("visible");clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove("visible"),1800);}});document.addEventListener("keydown",event=>{if(event.key==="Escape"){parent.postMessage({app:"typos-nav-studies",action:"escape"},"*");header.classList.remove("open");document.querySelectorAll(".menu-toggle").forEach(el=>el.setAttribute("aria-expanded","false"));}});addEventListener("scroll",()=>header.classList.toggle("compact",scrollY>60),{passive:true});document.fonts.ready.then(()=>{document.body.dataset.ready="true";parent.postMessage({app:"typos-nav-studies",action:"ready",id:'+id+'},"*");});<\/script></body></html>'}

function toggleSave(id){saved=saved.includes(id)?saved.filter(i=>i!==id):[...saved,id];try{localStorage.setItem('typos-nav-studies-favorites',JSON.stringify(saved))}catch{}render();notify(saved.includes(id)?'已收藏方案 '+number(id)+' · '+SCHEMES[id-1].name:'已移出收藏')}
document.getElementById('index').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(Number(b.dataset.id))});document.getElementById('view-modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;render()}});document.getElementById('device-modes').addEventListener('click',e=>{const b=e.target.closest('[data-width]');if(b){device=Number(b.dataset.width);render()}});document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';render()};document.getElementById('language').onclick=()=>{lang=lang==='zh'?'en':'zh';render()};document.getElementById('favorite').onclick=()=>toggleSave(current);document.getElementById('prev').onclick=()=>select(current-1);document.getElementById('next').onclick=()=>select(current+1);for(const target of ['gallery','compare'])document.getElementById(target).addEventListener('click',e=>{const save=e.target.closest('[data-save]');const open=e.target.closest('[data-open]');if(save)toggleSave(Number(save.dataset.save));else if(open)select(Number(open.dataset.open))});function setImmersive(on){immersive=on;document.body.classList.toggle('immersive',on);fitFrames()}document.getElementById('immersive').onclick=()=>setImmersive(true);document.getElementById('exit').onclick=()=>setImmersive(false);document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Escape'){setImmersive(false);return}if(mode!=='focus')return;if(e.key==='ArrowRight'){e.preventDefault();select(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();select(current-1)}if(e.key.toLowerCase()==='f'){e.preventDefault();toggleSave(current)}});document.getElementById('scroll-preview').onclick=()=>{const win=document.querySelector('#main-wrap iframe')?.contentWindow;if(win){const down=win.scrollY<60;win.scrollTo({top:down?360:0,behavior:'smooth'});document.getElementById('scroll-preview').textContent=down?'回到顶部 ↑':'模拟滚动 ↓'}};document.getElementById('export').onclick=()=>{if(!saved.length){notify('先收藏喜欢的方案，再导出选择。');return}const text='Typos 导航方案选择\n\n'+saved.map(id=>number(id)+' · '+SCHEMES[id-1].name+'\n'+SCHEMES[id-1].desc).join('\n\n')+'\n\n预览配色：'+theme+'\n预览宽度：'+device+'px\n';const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Typos-导航方案选择.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('收藏方案已导出')};addEventListener('message',e=>{if(e.data?.app!=='typos-nav-studies'||![...document.querySelectorAll('iframe')].some(f=>f.contentWindow===e.source))return;if(e.data.action==='escape'){setImmersive(false)}if(e.data.action==='theme'){theme=theme==='dark'?'light':'dark';render()}if(e.data.action==='language'){lang=lang==='zh'?'en':'zh';render()}});new ResizeObserver(fitFrames).observe(document.querySelector('.content'));render();
</script>
</body></html>
